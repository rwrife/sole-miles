name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vMAJOR.MINOR.PATCH+BUILD)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag and source
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -cnotmatch '^v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))\+(?<build>[1-9][0-9]*)$') { throw 'Expected tag vMAJOR.MINOR.PATCH+BUILD' }
          $version = $Matches.version
          $build = $Matches.build
          $tagSha = git rev-list -n 1 "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne (git rev-parse HEAD)) { throw 'Checkout does not match existing release tag' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify main history' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to main history' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "BUILD_NAME=$version" >> $env:GITHUB_ENV
          "BUILD_NUMBER=$build" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build portable Windows release
        run: flutter build windows --release --build-name "$env:BUILD_NAME" --build-number "$env:BUILD_NUMBER"
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$dir/sole_miles.exe") -or !(Test-Path "$dir/flutter_windows.dll") -or !(Test-Path "$dir/data")) { throw 'Incomplete Windows release output' }
          $zip = "sole-miles-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw 'Empty release archive' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip --clobber
          } else {
            gh release create $env:RELEASE_TAG $zip --verify-tag --title "Sole Miles $env:RELEASE_TAG" --notes-file CHANGELOG.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0 -or $assets -notcontains $zip) { throw 'Release archive missing after publication' }
