name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

  android:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --quiet --filter=blob:none --branch 3.47.2 https://github.com/flutter/flutter.git /opt/flutter-pinned
          echo /opt/flutter-pinned/bin >> "$GITHUB_PATH"
      - name: Verify Flutter pin
        run: |
          test "$(/opt/flutter-pinned/bin/flutter --version --machine | jq -r .frameworkVersion)" = 3.47.2
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - name: Build Android debug APK
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign
